name: hrms-ph-1

services:

  redis:
    image: hrms-ph-1-redis:7-alpine
    build:
      context: .
      dockerfile: ./backend/Dockerfile.redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: hrms-ph-1-backend:latest
    build: ./backend
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --access-logfile -
    volumes:
      - ./backend:/app
      - media_volume:/app/media
      - static_volume:/app/static
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DOCKER_DATABASE_URL:-postgres://hireflow_user:hireflow_pass@host.docker.internal:5432/hireflow}
      - DEBUG=${DEBUG:-1}
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    image: hrms-ph-1-worker:latest
    build: ./backend
    command: celery -A core worker -l info
    volumes:
      - ./backend:/app
      - media_volume:/app/media
      - static_volume:/app/static
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DOCKER_DATABASE_URL:-postgres://hireflow_user:hireflow_pass@host.docker.internal:5432/hireflow}
      - DEBUG=${DEBUG:-1}
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  beat:
    image: hrms-ph-1-worker:latest
    command: celery -A core beat -l info
    volumes:
      - ./backend:/app
      - media_volume:/app/media
      - static_volume:/app/static
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DOCKER_DATABASE_URL:-postgres://hireflow_user:hireflow_pass@host.docker.internal:5432/hireflow}
      - DEBUG=${DEBUG:-1}
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    image: hrms-ph-1-frontend:latest
    build: ./frontend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=/api/v1
      - API_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend

volumes:
  media_volume:
  static_volume:
  frontend_node_modules:
  redis_data:
