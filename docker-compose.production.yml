name: advance-hrms-production

x-backend: &backend
  image: advance-hrms-backend:production
  build: ./backend
  restart: unless-stopped
  env_file:
    - ${HRMS_ENV_FILE:?Set HRMS_ENV_FILE to a protected production environment file}
  environment:
    DEBUG: '0'
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/0
    CACHE_URL: redis://redis:6379/1
  volumes:
    - media:/app/media
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    <<: *backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media:/app/media
      - static:/app/static
  worker:
    <<: *backend
    command: celery -A core worker -l info
  beat:
    <<: *backend
    command: celery -A core beat -l info --schedule /var/lib/celery/celerybeat-schedule
    volumes:
      - media:/app/media
      - beat:/var/lib/celery

volumes:
  redis:
  media:
  static:
  beat:
